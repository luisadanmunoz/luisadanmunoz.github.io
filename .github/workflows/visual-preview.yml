name: "Capturas de revisión visual (temporal)"
on:
  push:
    branches: [visual-preview]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - run: bundle exec jekyll build
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4000 --directory _site &
          sleep 2
          cp .github/preview/shots.mjs ./shots.mjs
          node shots.mjs "/tmp/shots/${GITHUB_SHA::7}"
          mkdir -p "/tmp/shots/${GITHUB_SHA::7}/site" && cp _site/api/posts.json "/tmp/shots/${GITHUB_SHA::7}/site/"
      - run: |
          git config user.name "preview-bot"; git config user.email "preview-bot@users.noreply.github.com"
          git fetch origin preview-shots || true
          git checkout --orphan tmp
          git rm -rfq . ; rm -rf _site node_modules
          (git checkout origin/preview-shots -- . 2>/dev/null) || true
          mkdir -p shots && cp -r /tmp/shots/* shots/
          git add shots && git commit -qm "capturas ${GITHUB_SHA::7}"
          git push -f origin tmp:preview-shots
