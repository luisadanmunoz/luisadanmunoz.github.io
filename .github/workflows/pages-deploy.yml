name: "Construir y publicar la web"

# En cada pull request: construye la web y comprueba enlaces internos (no publica).
# En cada push a main: construye, comprueba y publica en GitHub Pages.
on:
  push:
    branches: [main]
    paths-ignore: [README.md, LICENSE]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Construir la web
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Comprobar enlaces internos
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --no-enforce-https \
            --ignore-empty-alt \
            --ignore-missing-alt

      - name: Guardar la web construida
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
