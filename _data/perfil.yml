experiencia:
  - cuando: Noviembre 2019 – actualidad
    puesto: Consultor de arquitectura en la nube
    empresa: Evolutio
    texto: >-
      Assessments de infraestructuras on-premises y Azure alineados con el Cloud Adoption Framework.
      Diseño y despliegue de servicios IaaS y PaaS automatizados con Terraform, migraciones por fases
      con Azure Migrate y documentación ejecutiva y técnica para SysOps y para la toma de decisiones
      de los clientes.
  - cuando: Septiembre 2010 – noviembre 2019
    puesto: Técnico de telecomunicaciones
    empresa: BT Group
    texto: >-
      Soporte a clientes y redes Cisco: routers, switches y firewalls con OSPF, EIGRP, BGP, VLAN y QoS.
      Gestión de incidencias con ITIL, planificación de proyectos y escalado técnico con el TAC de Cisco.
  - cuando: Noviembre 2008 – septiembre 2010
    puesto: Administrador de sistemas
    empresa: Convey Systems
    texto: >-
      Infraestructura IT y telecomunicaciones: entornos Microsoft (Active Directory, DNS, DHCP, GPO,
      DFS, WSUS), virtualización con VMware, telefonía IP y firewalls, coordinando equipos y proveedores.
  - cuando: Abril 2004 – noviembre 2008
    puesto: Administrador de sistemas
    empresa: MSI
    texto: >-
      Soporte a usuarios y administración de la infraestructura IT: incidencias de Windows, aplicaciones
      y conectividad, con Sysinternals y scripts de PowerShell.

