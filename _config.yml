# ============================================================
# Configuración del sitio luisadanmunoz.es
# Cambia aquí los datos generales. Tras editar este fichero,
# GitHub Actions vuelve a construir y publicar la web.
# ============================================================

title: Luis Adán Muñoz
tagline: Arquitectura Azure e IA, desde proyectos reales
description: >-
  Blog técnico de Luis Adán Muñoz, arquitecto cloud: Azure, Terraform,
  agentes de IA con Microsoft Foundry, seguridad y costes, contado desde
  proyectos reales y con el código para probarlo.
lang: es
locale: es_ES
timezone: Europe/Madrid

url: "https://luisadanmunoz.es"
baseurl: ""

author:
  name: Luis Adán Muñoz
  bio: Arquitecto cloud especializado en Azure, Terraform e IA con Microsoft Foundry.

# Redes. Deja vacío lo que no quieras mostrar.
social:
  linkedin: ""          # p. ej. https://www.linkedin.com/in/tu-usuario
  github: "https://github.com/luisadanmunoz"
  email: ""

# Newsletter (https://buttondown.com). Deja vacío para ocultar el formulario.
buttondown_user: "luisadanmunoz"

# Colores de cada categoría de artículos.
# 'icono' (opcional) es una imagen cuadrada PNG con fondo transparente que sustituye al cuadrado de color.
categorias:
  noticias:
    nombre: Noticias
    color: "#FFD64A"
    texto: "#101B35"
    descripcion: Novedades de Azure e IA, explicadas y con contexto.
    icono: /assets/img/icono-noticias.png   # opcional: sustituye al cuadrado de color
  azure:
    nombre: Azure
    color: "#3B5BF0"
    texto: "#FFFFFF"
    descripcion: Arquitectura, redes, Terraform, seguridad y costes.
  ia:
    nombre: IA
    color: "#0E8C70"
    texto: "#FFFFFF"
    descripcion: Agentes y soluciones con Microsoft Foundry.
    icono: /assets/img/icono-ia.png

# ------------------------------------------------------------
# Construcción
# ------------------------------------------------------------
permalink: /posts/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3

collections:
  recursos:
    output: true
    permalink: /recursos/:path/

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      categoria: azure
  - scope: { path: "", type: recursos }
    values:
      layout: recurso
      estado: proximamente
  - scope: { path: "" }
    values:
      layout: page
      image: /assets/img/og-default.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - resource
  - vendor
  - .bundle
  - .jekyll-cache
  - .devcontainer
  - .vscode
  - .editorconfig
  - .gitattributes
  - .markdownlint.json
